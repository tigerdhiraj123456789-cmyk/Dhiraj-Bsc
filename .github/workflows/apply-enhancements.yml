name: Apply Dhiraj BSc enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-site:
    if: ${{ !contains(github.event.head_commit.message, '[skip enhance]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="site-enhancements.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit enhancement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Apply Dhiraj BSc content enhancements [skip enhance]' && git push)
